server:
  port: ${PORT:8080}

wph:
  tencent:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    region: ${TENCENT_REGION:ap-guangzhou}
    version: ${TENCENT_VERSION:2023-09-01}
    base-url: ${TENCENT_BASE_URL:https://hunyuan.tencentcloudapi.com}
    service: hunyuan
  console:
    data-dir: ${WPH_CONSOLE_DATA_DIR:./data}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wph?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:wph}
    password: ${SPRING_DATASOURCE_PASSWORD:wph}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
