<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web 题目助手</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .wrap { width: 340px; padding: 12px; box-sizing: border-box; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .title { font-size: 14px; font-weight: 700; }
      .badge { padding: 2px 8px; border-radius: 999px; color: #fff; font-size: 12px; line-height: 18px; }
      .muted { color: #666; font-size: 12px; }
      .card { margin-top: 10px; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
      .btns { display: flex; gap: 8px; margin-top: 10px; }
      button { border: 1px solid #ddd; background: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
      button.primary { background: #1677ff; color: #fff; border-color: #1677ff; }
      button.danger { background: #fff1f0; color: #cf1322; border-color: #ffa39e; }
      input { width: 100%; box-sizing: border-box; border: 1px solid #ddd; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
      .status { margin-top: 8px; font-size: 12px; color: #444; white-space: pre-wrap; word-break: break-word; }
      ul { margin: 8px 0 0 18px; padding: 0; }
      li { font-size: 12px; margin: 4px 0; }
      .hint { margin-top: 8px; font-size: 12px; color: #888; }
      textarea { width: 100%; height: 110px; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </head>
  <body>
    <div id="root" class="wrap">加载中...</div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
