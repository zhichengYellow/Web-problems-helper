worker_processes  1;

# Allow passing backend target via container env
env BACKEND_HOST;
env BACKEND_PORT;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 3000;

    # Docker embedded DNS (allow backend container to appear later)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host $BACKEND_HOST;
    set $backend_port $BACKEND_PORT;

    # Defaults (if env not set)
    if ($backend_host = "") { set $backend_host "host.docker.internal"; }
    if ($backend_port = "") { set $backend_port "8080"; }

    # Frontend static (mounted)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    # Console UI (static)
    location /console/ {
      alias /usr/share/nginx/html/console/;
      try_files $uri $uri/ /console/index.html;
    }

    location /api/ {
      proxy_pass http://$backend_host:$backend_port;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Useful for health checks from browser/extension
    location /actuator/ {
      proxy_pass http://$backend_host:$backend_port;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
