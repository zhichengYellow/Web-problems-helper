<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Problems Helper Console</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; margin: 0; background: #fafafa; }
    header { padding: 16px 18px; background: #fff; border-bottom: 1px solid #eee; }
    h1 { font-size: 16px; margin: 0; }
    main { padding: 18px; max-width: 980px; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button { border: 1px solid #ddd; background: #fff; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; }
    button.primary { background: #1677ff; color: #fff; border-color: #1677ff; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    pre { background: #0b1020; color: #d6e1ff; padding: 10px; border-radius: 10px; overflow: auto; font-size: 12px; }
    .muted { color: #666; font-size: 12px; }
    textarea { width: 100%; height: 160px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; font-size: 12px; box-sizing: border-box; }
  </style>
</head>
<body>
  <header>
    <h1>Console（nginx 静态页）</h1>
    <div class="muted">用于验证 Web(3000) ↔ 后端(8080) ↔ 导入接口是否可用。</div>
  </header>
  <main>
    <div class="card">
      <div class="row">
        <button id="btnHealth" class="primary">检查后端健康（/actuator/health）</button>
        <button id="btnImport">测试导入（/api/console/questions/import）</button>
      </div>
      <div class="muted" style="margin-top:10px">说明：当前页面同源访问 <code>/actuator/health</code> 与 <code>/api/...</code>，由 nginx 反代到后端。</div>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <div>
          <div style="font-weight:600; font-size:13px">导入请求体（JSON 数组）</div>
          <div class="muted">可以粘贴扩展导出的数据自行改造/测试。</div>
        </div>
        <button id="btnFormat">格式化</button>
      </div>
      <textarea id="payload"></textarea>
    </div>

    <div class="card">
      <div style="font-weight:600; font-size:13px">输出</div>
      <pre id="out">准备就绪。</pre>
    </div>
  </main>

  <script>
    const out = document.getElementById('out');
    const payload = document.getElementById('payload');

    const defaultPayload = [
      {
        externalId: 'console:test:1',
        platform: 'console',
        url: location.origin + '/console/',
        type: 'programming',
        questionText: 'hello from console',
        options: [],
        answer: '',
        knowledgePoints: [],
        tags: [],
        source: 'manual'
      }
    ];

    payload.value = JSON.stringify(defaultPayload, null, 2);

    function print(obj) {
      out.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
    }

    document.getElementById('btnFormat').addEventListener('click', () => {
      try {
        payload.value = JSON.stringify(JSON.parse(payload.value), null, 2);
      } catch (e) {
        print('JSON 解析失败：' + String(e));
      }
    });

    document.getElementById('btnHealth').addEventListener('click', async () => {
      try {
        const r = await fetch('/actuator/health');
        const text = await r.text();
        print({ ok: r.ok, status: r.status, body: safeJson(text) });
      } catch (e) {
        print('请求失败：' + String(e));
      }
    });

    document.getElementById('btnImport').addEventListener('click', async () => {
      try {
        const body = payload.value;
        const r = await fetch('/api/console/questions/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body
        });
        const text = await r.text();
        print({ ok: r.ok, status: r.status, body: safeJson(text) });
      } catch (e) {
        print('请求失败：' + String(e));
      }
    });

    function safeJson(text) {
      try { return JSON.parse(text); } catch { return text; }
    }
  </script>
</body>
</html>
