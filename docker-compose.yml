services:
  mysql:
    image: mysql:8.0
    container_name: wph-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: wph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend-java:
    build:
      context: ./apps/backend-java
      dockerfile: Dockerfile
    container_name: wph-backend-java
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/wph?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "wph"
      SPRING_DATASOURCE_PASSWORD: "wph"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: wph-nginx
    ports:
      - "3000:3000"
    environment:
      # Default to host backend (works even if backend-java image can't be built)
      BACKEND_HOST: "host.docker.internal"
      BACKEND_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro

volumes:
  mysql_data:
  redis_data:
