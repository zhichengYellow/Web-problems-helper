<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器环境测试 - 后端模式</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🌐 浏览器环境测试 - 后端模式</h1>
    
    <div class="test-section">
        <h2>1. 环境检测</h2>
        <div id="env-check">
            <p>正在检测环境...</p>
        </div>
    </div>

    <div class="test-section">
        <h2>2. 模块加载测试</h2>
        <button onclick="testModuleLoading()">测试模块加载</button>
        <div id="module-load-result">
            <p>等待测试...</p>
        </div>
    </div>

    <div class="test-section">
        <h2>3. 后端连通性测试</h2>
        <p>
            后端地址：
            <input id="backend-base" style="width: 320px; padding: 6px;" value="http://localhost:3001" />
        </p>
        <button onclick="testBackend()">测试后端 /health 与 /api/chat</button>
        <div id="backend-result">
            <p>等待测试...</p>
        </div>
    </div>

    <div class="test-section">
        <h2>4. 错误处理测试</h2>
        <button onclick="testErrorHandling()">测试后端不可用时的错误提示</button>
        <div id="error-result">
            <p>等待测试...</p>
        </div>
    </div>

    <script>
        // 环境检测
        function checkEnvironment() {
            const envDiv = document.getElementById('env-check');
            const results = [];
            
            // 检查crypto API
            if (typeof window !== 'undefined' && window.crypto) {
                results.push('✅ window.crypto API可用');
            } else {
                results.push('❌ window.crypto API不可用');
            }
            
            // 检查require函数
            if (typeof require !== 'undefined') {
                results.push('⚠️ require函数可用（Node.js环境）');
            } else {
                results.push('✅ require函数不可用（浏览器环境）');
            }
            
            // 检查模块导出
            if (typeof module !== 'undefined' && module.exports) {
                results.push('⚠️ module.exports可用（Node.js环境）');
            } else {
                results.push('✅ module.exports不可用（浏览器环境）');
            }
            
            envDiv.innerHTML = results.map(r => `<p>${r}</p>`).join('');
        }

        // 测试模块加载
        function testModuleLoading() {
            const resultDiv = document.getElementById('module-load-result');
            resultDiv.innerHTML = '<p>正在加载模块...</p>';
            
            try {
                // 动态加载hunyuan-service.js
                const script = document.createElement('script');
                script.src = 'hunyuan-service.js';
                script.onload = function() {
                    if (typeof HunyuanService !== 'undefined') {
                        resultDiv.innerHTML = '<p class="success">✅ HunyuanService类加载成功</p>';
                    } else {
                        resultDiv.innerHTML = '<p class="error">❌ HunyuanService类未定义</p>';
                    }
                };
                script.onerror = function() {
                    resultDiv.innerHTML = '<p class="error">❌ 加载hunyuan-service.js失败</p>';
                };
                document.head.appendChild(script);
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ 加载失败: ${error.message}</p>`;
            }
        }

        // 测试后端连通性（/health + /api/chat）
        async function testBackend() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = '<p>正在测试后端...</p>';

            const base = (document.getElementById('backend-base')?.value || 'http://localhost:3001').replace(/\/$/, '');
            const healthUrl = `${base}/health`;
            const chatUrl = `${base}/api/chat`;

            try {
                const healthRes = await fetch(healthUrl);
                const healthText = await healthRes.text();
                if (!healthRes.ok) {
                    resultDiv.innerHTML = `<p class="error">❌ /health 失败: HTTP ${healthRes.status}</p><pre>${healthText}</pre>`;
                    return;
                }

                const chatRes = await fetch(chatUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: '浏览器测试：请只回答数字，1+1=?' })
                });
                const chatText = await chatRes.text();
                if (!chatRes.ok) {
                    resultDiv.innerHTML = `<p class="error">❌ /api/chat 失败: HTTP ${chatRes.status}</p><pre>${chatText}</pre>`;
                    return;
                }

                resultDiv.innerHTML = `
                    <p class="success">✅ 后端连通性正常</p>
                    <p>/health 返回:</p>
                    <pre>${healthText}</pre>
                    <p>/api/chat 返回:</p>
                    <pre>${chatText}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ 请求失败: ${error.message}</p>`;
            }
        }

        // 测试错误处理（后端不可用时）
        function testErrorHandling() {
            const resultDiv = document.getElementById('error-result');
            resultDiv.innerHTML = '<p>测试后端不可用时的错误提示...</p>';
            
            try {
                if (typeof HunyuanService === 'undefined') {
                    resultDiv.innerHTML = '<p class="error">❌ 请先加载模块</p>';
                    return;
                }
                
                const service = new HunyuanService();
                // 指向一个不存在的端口，确保触发网络错误
                service.backendUrl = 'http://localhost:9/api/chat';
                
                service.callHunyuanLite('测试问题')
                    .then(result => {
                        resultDiv.innerHTML = '<p class="error">❌ 错误处理失败 - 应该因后端不可用抛出错误</p>';
                    })
                    .catch(error => {
                        resultDiv.innerHTML = `
                            <p class="success">✅ 错误处理正常</p>
                            <p>错误消息: ${error.message}</p>
                        `;
                    });
            } catch (error) {
                resultDiv.innerHTML = `<p class="success">✅ 错误处理正常: ${error.message}</p>`;
            }
        }

        // 页面加载时运行环境检测
        document.addEventListener('DOMContentLoaded', checkEnvironment);
    </script>
</body>
</html>
